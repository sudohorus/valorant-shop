# Gera o APK do app no GitHub, sem Expo/EAS e sem Android SDK local.
#
# Roda a cada push no main que mexa em mobile/ (ou pelo botão
# "Run workflow" na aba Actions) e publica o APK como Release,
# pronto para baixar pelo celular.
#
# Assinatura: todo build usa a MESMA chave (secret ANDROID_KEYSTORE_BASE64),
# senão o Android recusa instalar uma versão por cima da outra.
# Sem o secret o build ainda sai, mas com uma chave aleatória.

name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Push novo cancela o build anterior que ainda estiver rodando.
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # criar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      # Histórico completo + tags: as notas da release comparam com o APK anterior.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native compila com JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # 1.0.<número do build>; o versionCode crescente é o que o Android
      # usa para aceitar a instalação por cima como atualização.
      - name: Versão do app
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.version = '1.0.' + process.env.RUN;
            config.expo.android = { ...config.expo.android, versionCode: Number(process.env.RUN) };
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          "

      # Gera a pasta android/ a partir do app.json (plugins inclusos).
      - run: npx expo prebuild --platform android --clean --no-install

      # O projeto gerado assina o release com android/app/debug.keystore
      # (senha "android", alias "androiddebugkey"); trocamos pela nossa.
      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/debug.keystore
            echo "Usando a chave do secret."
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK assinado com chave aleatória."
          fi

      # Só arm64 (praticamente todo celular atual): build mais rápido e APK menor.
      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk valorant-shop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: valorant-shop-apk
          path: mobile/valorant-shop.apk
          retention-days: 30

      # Changelog a partir dos commits desde o APK anterior, agrupado pelo
      # tipo do commit (feat/fix/resto) e sem o prefixo técnico.
      - name: Notas da versão
        working-directory: .
        run: |
          PREV=$(git tag --list 'apk-*' --sort=-v:refname | head -n 1)

          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="-n 20"
          fi

          git log $RANGE --no-merges --pretty='%s|%h' -- mobile .github > commits.txt

          awk -F'|' '
            {
              type = $1; sub(/[(:!].*/, "", type)
              msg = $1;  sub(/^[a-z]+(\([^)]*\))?!?: */, "", msg)
              line = "- " toupper(substr(msg, 1, 1)) substr(msg, 2) " (" $2 ")\n"
              if (type == "feat") feat = feat line
              else if (type == "fix") fix = fix line
              else other = other line
            }
            END {
              if (feat)  printf "### Novidades\n%s\n", feat
              if (fix)   printf "### Correções\n%s\n", fix
              if (other) printf "### Outras mudanças\n%s\n", other
            }
          ' commits.txt > notes.md

          [ -s notes.md ] || echo "Sem mudanças no app desde a versão anterior." > notes.md

          {
            echo
            echo "---"
            echo "Baixe o **valorant-shop.apk** abaixo e instale: atualiza por cima da versão anterior, sem perder seus dados."
          } >> notes.md

          cat notes.md

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Valorant Shop 1.0.${{ github.run_number }}
          body_path: notes.md
          files: mobile/valorant-shop.apk
          make_latest: true
