# Gera o APK do app no GitHub, sem Expo/EAS e sem Android SDK local.
#
# Roda a cada push no main que mexa em mobile/ (ou pelo botão
# "Run workflow" na aba Actions) e publica o APK como Release,
# pronto para baixar pelo celular.
#
# Assinatura: todo build usa a MESMA chave (secret ANDROID_KEYSTORE_BASE64),
# senão o Android recusa instalar uma versão por cima da outra.
# Sem o secret o build ainda sai, mas com uma chave aleatória.

name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Push novo cancela o build anterior que ainda estiver rodando.
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # criar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native compila com JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Gera a pasta android/ a partir do app.json (plugins inclusos).
      - run: npx expo prebuild --platform android --clean --no-install

      # O projeto gerado assina o release com android/app/debug.keystore
      # (senha "android", alias "androiddebugkey"); trocamos pela nossa.
      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/debug.keystore
            echo "Usando a chave do secret."
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK assinado com chave aleatória."
          fi

      # Só arm64 (praticamente todo celular atual): build mais rápido e APK menor.
      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk valorant-shop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: valorant-shop-apk
          path: mobile/valorant-shop.apk
          retention-days: 30

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          body: 'Build de ${{ github.sha }}. Baixe o valorant-shop.apk abaixo e instale no celular.'
          files: mobile/valorant-shop.apk
          make_latest: true
